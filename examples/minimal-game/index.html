<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Minimal Game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #play { position: fixed; left: 50%; top: 60%; transform: translate(-50%, -50%); font: 700 24px system-ui; padding: 12px 28px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="play">Play</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
